function playCue(cue) {
  if (!soundEnabled || activePlayback) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    if (!audioContext || audioContext.state === 'closed') {
      audioContext = new Audio();
      cueBus = audioContext.createGain();
      cueBus.connect(audioContext.destination);
    }
    const play = () => {
      if (!soundEnabled || audioContext.state !== 'running') return;
      const now = audioContext.currentTime;
      for (const [frequency, offset, length] of soundCues[cue]) {
        const start = now + offset;
        const note = audioContext.createOscillator();
        const envelope = audioContext.createGain();
        note.type = 'sine';
        note.frequency.value = frequency;
        envelope.gain.setValueAtTime(0, start);
        envelope.gain.linearRampToValueAtTime(.07, start + .012);
        envelope.gain.exponentialRampToValueAtTime(.001, start + length);
        note.connect(envelope);
        envelope.connect(cueBus);
        note.onended = () => { note.disconnect(); envelope.disconnect(); };
        note.start(start);
        note.stop(start + length + .015);
      }
    };
    cueBus.gain.value = 1;
    if (audioContext.state === 'running') play();
    else audioContext.resume().then(play).catch(() => {});
  } catch {
    // A browser can deny audio without interrupting the exercise.
  }
}

function dayKey(offset = 0) {

}

function gapOf(word) {
  const term = plainWord(word.x.w);
  const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const wholeWord = value => new RegExp(`(^|[^\\p{L}])(${value})(?![\\p{L}])`, 'iu');
  const exact = wholeWord(escapeRegex(term));
  const stem = term.length > 5 ? wholeWord(`${escapeRegex(term.slice(0, -2))}[\\p{L}]*`) : null;
  const examples = (word.x.s || translation(word).de || '').split(' | ');
  for (const pattern of [exact, stem].filter(Boolean)) {
    for (const sentence of examples) {
      const match = sentence.match(pattern);
      if (!match) continue;
      const start = match.index + match[1].length;
      const prompt = `${sentence.slice(0, start)}_____` + sentence.slice(start + match[2].length);
      return { prompt, solution: match[2], sentence };
    }
  }
  return null;
}

function eligible(word, type) {
  const x = word.x;
  if (type === 'cards' || type === 'list') return x.t === cat;
  if (type === 'article') return x.t === 'n' && ['der', 'die', 'das'].includes(x.a) && !x.p?.includes('nur Plural');
  if (type === 'plural') return x.t === 'n' && x.p && !x.p.startsWith('–');
  return type === 'gap' && !!gapOf(word);
}

function scopedWords() {
  return allWords.filter(word => (ch === 'all' || word.k === ch) && (!tp || word.x.tp === tp));

function manualPool() {

function reviewQueue(kind, today) {
  return Object.values(S.reviews).filter(item => {
    if (!canReview(item) || typeof item.due !== 'string') return false;
    return kind === 'mistakes' ? item.missed : item.due <= today;
  }).sort((a, b) => Number(b.missed) - Number(a.missed) || a.due.localeCompare(b.due));
}

function newWordQueue(today) {
  const introduced = new Set(Object.values(S.reviews).map(item => item?.id));
  const dailyCount = S.newWords?.day === today && Array.isArray(S.newWords.ids) ? S.newWords.ids.length : 0;
  return scopedWords().filter(word => !introduced.has(word.id) && !box(word.id)).slice(0, Math.max(0, maxNewWords - dailyCount));
}

function oldRound(kind, today) {
  const round = S.rounds[kind];
  if (!isRecord(round) || !Array.isArray(round.queue) || !Array.isArray(round.retried) ||

      !round.queue.slice(round.index).every(canReview)) return null;
  // A finished day gets a fresh queue. Mistake sessions remain resumable.
  return kind === 'today' && round.day !== today ? null : round;
}

function canReview(item) {
  const word = wordsById.get(item?.id);

function pickManual(previous) {
  const pool = manualPool();
  let options = pool.length > 1 ? pool.filter(word => word.id !== previous) : pool;
  if (mode === 'cards') {
    const lowest = options.reduce((minimum, word) => Math.min(minimum, box(word.id)), Infinity);
    options = options.filter(word => box(word.id) === lowest);
  }
  return options[Math.floor(Math.random() * options.length)] || null;
}

    const queue = reviewQueue(kind, today).slice(0, maxQuestions).map(({ id, type }) => ({ id, type }));
    if (kind === 'today') {
      const newWords = newWordQueue(today).slice(0, maxQuestions - queue.length);
      queue.push(...newWords.map(word => ({ id: word.id, type: 'cards', fresh: true })));
    }
    if (!queue.length) {
      activeRound = null;
      results = { kind, empty: true };
      save();
      render();
      $('#leave-round').focus();
      return;
    }
    round = { day: today, queue, index: 0, shown: false, answer: null, guess: '', right: 0, attempts: 0, retried: [] };
    S.rounds[kind] = round;
  }
  activeRound = kind;
  results = null;
  save();
  render('session');
  $('#round-title').focus();
}

function leaveRound() {
  activeRound = null;
  results = null;
  save();
  render();
  $('#study-today').focus();
}

function markReview(word, type, correct, item) {
  const key = reviewKey(word.id, type);
  const previous = S.reviews[key];
  const today = dayKey();
  let level = Number.isInteger(previous?.level) ? Math.min(reviewIntervals.length - 1, Math.max(-1, previous.level)) : -1;
  if (!correct) level = -1;
  else if (!previous || typeof previous.due !== 'string' || previous.due <= today || previous.missed) level = Math.min(level + 1, reviewIntervals.length - 1);
  const due = correct && typeof previous?.due === 'string' && !previous.missed && previous.due > today
    ? previous.due : dayKey(correct ? reviewIntervals[level] : 1);
  S.reviews[key] = { id: word.id, type, level, due, missed: !correct };
  if (type === 'cards') S[word.id] = correct ? Math.min(4, box(word.id) + 1) : 0;
  if (item?.fresh) {
    if (S.newWords?.day !== today || !Array.isArray(S.newWords.ids)) S.newWords = { day: today, ids: [] };
    if (!S.newWords.ids.includes(word.id)) S.newWords.ids.push(word.id);
  }
}

function submit(word, type, correct, solution, form, note = '') {
  const round = activeRound && S.rounds[activeRound];
  if (round ? round.answer : answer) return;
  const feedback = { correct, solution, note };
  playCue(correct ? 'correct' : 'retry');
  if (round) {
    const item = round.queue[round.index];
    markReview(word, type, correct, item);
    round.attempts++;
    if (correct) round.right++;
    const key = reviewKey(word.id, type);
    if (!correct && !round.retried.includes(key)) {
      round.retried.push(key);
      // Give the answer a little time to settle before asking again.
      round.queue.splice(round.index + 3, 0, { id: word.id, type });
    }
    round.answer = feedback;
  } else {
    markReview(word, type, correct);
    score[1]++;
    if (correct) score[0]++;
    answer = feedback;
    guess = form || '';
  }
  save();
  render(correct ? 'success' : 'miss');
  $('#next-question').focus();
}

function advance() {
  if (!activeRound) return selectManual(false, 'step');
  const round = S.rounds[activeRound];
  round.index++;
  round.answer = null;
  round.guess = '';
  round.shown = false;
  if (round.index >= round.queue.length) {
    results = { kind: activeRound, correct: round.right, attempts: round.attempts };
    delete S.rounds[activeRound];
    activeRound = null;
    playCue('finish');
  }
  save();
  render(results ? 'finish' : 'step');
  if (results) $('#leave-round').focus();
  else $('#prompt').focus();
}

function voicePriority(voice) {
  let priority = /^de[-_]de$/i.test(voice.lang) ? 100 : 0;
  const label = `${voice.name} ${voice.voiceURI}`;
  if (/premium|\bpro\b|neural|natural|enhanced|erweitert|siri/i.test(label)) priority += 40;
  else if (/google|online/i.test(label)) priority += 20;
  return priority + (voice.default ? 1 : 0);
}

function germanVoices() {
  return (speech?.getVoices() || []).filter(voice => /^de(?:[-_]|$)/i.test(voice.lang))
    .sort((a, b) => voicePriority(b) - voicePriority(a) || a.name.localeCompare(b.name, 'de'));
}

function updateVoiceOptions() {
  const voices = germanVoices();
  const select = $('#voice-select');
  const defaultLabel = voices.length ? `Automatisch (${voices[0].name})` : 'Automatisch';
  select.replaceChildren(new Option(defaultLabel, ''), ...voices.map(voice => new Option(voice.name, voice.voiceURI)));
  select.value = voices.some(voice => voice.voiceURI === preferredVoice) ? preferredVoice : '';
  select.disabled = !voices.length;
  $('#voice-hint').textContent = voices.length ? '' : 'Für zusätzliche Beispiele wird die deutsche Browserstimme verwendet, falls verfügbar.';
}

function spokenHeadword(x) {
  let term = plainWord(x.w).replace(/,\s*-[\p{L}]+$/u, '').replace(/\s*\.{3}\s*/g, ', ');
  if (/\(sich\)$/.test(x.w)) term = `sich ${term}`;
  const article = x.a?.split('/')[0]?.trim();
  return article && !term.toLocaleLowerCase('de-DE').startsWith(`${article} `) ? `${article} ${term}` : term;
}

function spokenExamples(sentences) {
  return sentences.map(sentence => {
    const text = sentence.replace(/\s+[–—-]\s+/g, ' ').trim();
    return /[.!?][”"»]?$/.test(text) ? text : `${text}.`;
  }).join(' ');
}

function finishPlayback(playback, failed = false) {
  if (activePlayback !== playback) return;
  activePlayback = null;
  $('#playback-banner').hidden = true;
  const status = $('#speech-status');
  status.textContent = failed ? 'Die Aussprache konnte nicht abgespielt werden. Tippe erneut zum Anhören.' : '';
  status.hidden = !failed;
}

function stopPlayback() {
  const playback = activePlayback;
  if (!playback) return;
  finishPlayback(playback);
  playback.stop?.();
}

function speak(text, clipId) {
  if (activePlayback) return;
  const playback = {};
  activePlayback = playback;
  $('#speech-status').hidden = true;
  $('#playback-banner').hidden = false;
  try {
    if (clipId) {
      const audio = new Audio();
      playback.stop = () => audio.pause();
      audio.onended = () => finishPlayback(playback);
      audio.onerror = () => finishPlayback(playback, true);
      loadPronunciation(clipId).then(clips => {
        if (activePlayback !== playback) return;
        if (!clips[clipId]) throw new Error('Pronunciation clip missing');
        audio.src = `data:audio/mpeg;base64,${clips[clipId]}`;
        audio.playbackRate = speechSlow ? .78 : 1;
        audio.preservesPitch = true;
        return audio.play();
      }).catch(() => finishPlayback(playback, true));
      return;
    }
    if (!speech || !window.SpeechSynthesisUtterance) return finishPlayback(playback, true);
    const voices = germanVoices();
    const voice = voices.find(item => item.voiceURI === preferredVoice) || voices[0];
    const utterance = new window.SpeechSynthesisUtterance(text);
    if (voice) utterance.voice = voice;
    utterance.lang = voice?.lang.replace('_', '-') || 'de-DE';
    utterance.rate = speechSlow ? .75 : .98;
    playback.stop = () => speech.cancel();
    utterance.onend = () => finishPlayback(playback);
    utterance.onerror = event => finishPlayback(playback, !['canceled', 'interrupted'].includes(event.error));
    speech.speak(utterance);
  } catch {
    finishPlayback(playback, true);
  }
}

function headsUp(round) {
  const step = round.index + 1;
  const total = round.queue.length;
  return `<div class="study-controls"><h2 id="round-title" tabindex="-1">${roundNames[activeRound]}</h2><button class="mini" id="leave-round">Später weiterüben</button></div>
    ${answerProgress(round.right, round.attempts, total, step)}`;
}

function answerProgress(right, attempts, total = attempts, step = null) {
  const wrong = attempts - right;
  const divisor = total || 1;
  const progress = step === null ? 'aria-hidden="true"'
    : `role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${attempts}" aria-valuetext="${attempts} von ${total} beantwortet"`;
  return `<div class="study-progress answer-score">
    <div class="answer-score-labels">${step === null ? '' : `<p class="stat">${step} von ${total}</p>`}<p class="stat"><span class="ok">${right} richtig</span> · <span class="no">${wrong} falsch</span></p></div>
    <div class="bar answer-score-bar" ${progress}><i class="answer-score-right" style="width:${right / divisor * 100}%"></i><i class="answer-score-wrong" style="width:${wrong / divisor * 100}%"></i></div>
  </div>`;
}

function feedbackHtml(feedback) {
  if (!feedback) return '';
  return `<div id="fb" role="status" class="${feedback.correct ? 'correct' : 'incorrect'}"><span class="${feedback.correct ? 'ok' : 'no'}"><span aria-hidden="true">${feedback.correct ? '✓' : '↻'}</span> ${feedback.correct ? 'Richtig!' : 'Noch einmal üben.'}</span> ${html(feedback.solution)}${feedback.note ? `<div class="sub letter-note">${html(feedback.note)}</div>` : ''}</div>`;
}

function meaningPicture(x) {
  const term = plainWord(x.w);
  return (owns(visualMeanings, term) ? visualMeanings[term] : '') || x.m || '';
}

function pictureWord(x, text, tone = '') {
  const picture = meaningPicture(x);
  return `<div class="picture-word"><span class="big ${html(tone)}">${text}</span>${picture ? `<span class="meaning-picture" role="img" aria-label="Bildhinweis">${html(picture)}</span>` : ''}</div>`;
}

function translationDetails(word) {
  const known = meaning(word);
  const t = translation(word);
  if (!known && !t.ar && !t.ard) return '';
  return `<details class="meaning-translation"><summary>Übersetzung anzeigen</summary>${known ? `<div class="sub" lang="en">${html(known)}</div>` : ''}${t.ar ? `<div class="ar" lang="ar">${html(t.ar)}</div>` : ''}${t.ard ? `<div class="ar" lang="ar">${html(t.ard)}</div>` : ''}</details>`;
}

function pronunciationButtons(word, sentences = []) {
  const plural = pluralClips[word.id];
  return `<div class="answer-audio" aria-label="Aussprache"><button class="mini audio" id="sp" type="button"><span aria-hidden="true">🔊</span> ${word.x.t === 'n' ? 'Artikel + Wort' : 'Wort anhören'}</button>
    ${plural ? '<button class="mini audio" id="sp-plural" type="button"><span aria-hidden="true">🔊</span> Plural</button>' : ''}
    ${sentences.length ? `<button class="mini audio" id="sp-sentence" type="button"><span aria-hidden="true">🔊</span> ${sentences.length === 1 ? 'Satz anhören' : 'Beispiele anhören'}</button>` : ''}</div>`;
}

function bindPronunciation(word, sentences = []) {
  const [termClip, examplesClip] = pronunciationClips.cards[word.id] || [];
  [termClip, examplesClip, pluralClips[word.id]].forEach(preloadPronunciation);
  $('#sp').onclick = () => speak(spokenHeadword(word.x), termClip);
  if ($('#sp-plural')) $('#sp-plural').onclick = () => speak(pluralText(word.x), pluralClips[word.id]);
  if ($('#sp-sentence')) $('#sp-sentence').onclick = () => speak(spokenExamples(sentences), examplesClip);
}

function renderCard(word, round, cardShown, feedback) {
  preloadPronunciation(pronunciationClips.cards[word.id]?.[0]);
  const x = word.x;
  const t = translation(word);
  const wordText = html(x.w);
  const label = x.t === 'n' ? (cardShown ? `${html(x.a)} ${wordText}` : `___ ${wordText}`) : wordText;
  const sentences = (x.s || t.de || '').split(' | ').filter(Boolean);
  let details = '';
  if (cardShown) {
    if (x.t === 'n') details += `<div class="pl">${html(pluralText(x))}</div>`;
    if (x.t === 'v' && (x.er || x.pf)) details += `<div>${[x.er, x.pf].filter(Boolean).map(html).join(' · ')}</div>`;
    details += pronunciationButtons(word, sentences);
    if (sentences.length) details += `<div class="sent">${sentences.map(html).join('<br>')}</div>`;
    details += translationDetails(word);
    if (sampler && !t.ar && !feedback) details += '<button class="mini" id="tb">Beispiel und Übersetzung ergänzen</button>';
  }
  const learned = round ? '' : flashcardProgress();
  $('#prompt').innerHTML = `<div class="card" id="c"${cardShown ? '' : ' role="button" tabindex="0" aria-label="Antwort zeigen"'}>
    ${pictureWord(x, label, cardShown ? x.a?.split('/')[0] : '')}
    ${cardShown ? details : '<div class="sub">Antwort zeigen</div>'}${feedbackHtml(feedback)}</div>
    ${cardShown && !feedback ? '<div class="btns"><button id="m1">Noch üben</button><button class="primary" id="g1">Gewusst</button></div>' : ''}${learned}`;
  if (!cardShown) {
    const card = $('#c');
    const reveal = () => {
      if (round) round.shown = true;
      else shown = true;
      playCue('reveal');
      save();
      render('reveal');
      $('#g1').focus();
    };
    card.onclick = reveal;
    card.onkeydown = event => {
      if (!['Enter', ' '].includes(event.key)) return;
      event.preventDefault();
      reveal();
    };
    return;
  }
  bindPronunciation(word, sentences);
  if ($('#tb')) $('#tb').onclick = event => ask(word, event.currentTarget);
  if (!feedback) {
    $('#m1').onclick = () => submit(word, 'cards', false, '');
    $('#g1').onclick = () => submit(word, 'cards', true, '');
  }
}

function flashcardProgress() {
  const words = manualPool();
  const done = words.filter(word => box(word.id) > 0).length;
  return `<div class="bar"><i style="width:${words.length ? done / words.length * 100 : 0}%"></i></div><div class="stat">${done} von ${words.length} gelernt</div>`;
}

function renderArticle(word, feedback) {
  const x = word.x;
  $('#prompt').innerHTML = `<div class="card ${feedback ? feedback.correct ? 'good' : 'bad' : ''}">
    ${pictureWord(x, `${feedback ? html(x.a) : '___'} ${html(x.w)}`, feedback ? x.a : '')}
    ${feedback ? `${feedbackHtml(feedback)}${pronunciationButtons(word)}${translationDetails(word)}` : '<div class="sub">Welcher Artikel passt?</div>'}</div>
    ${feedback ? '' : `<div class="btns">${['der', 'die', 'das'].map(article => `<button class="${article}" data-article="${article}">${article}</button>`).join('')}</div>`}`;
  if (feedback) bindPronunciation(word);
  view.querySelectorAll('[data-article]').forEach(button => {
    button.onclick = () => submit(word, 'article', button.dataset.article === x.a, `${x.a} ${x.w}`);
  });
}

function renderWritten(word, type, round, feedback, entered) {
  const x = word.x;
  const gap = type === 'gap' ? gapOf(word) : null;
  const label = gap ? 'Satz ergänzen' : 'Plural eingeben';
  const question = gap ? `<div class="sentence-question">${pictureWord(x, html(gap.prompt))}</div>`
    : `${pictureWord(x, `${html(x.a)} ${html(x.w)}`, x.a?.split('/')[0])}<div class="sub">Plural · die …</div>`;
  $('#prompt').innerHTML = `<form id="written"><div class="card ${feedback ? feedback.correct ? 'good' : 'bad' : ''}">${question}
    <input id="ans" aria-label="${label}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${html(entered)}"${feedback ? ' readonly' : ''} required>
    ${feedback ? `${feedbackHtml(feedback)}${pronunciationButtons(word)}${translationDetails(word)}` : `<div class="letters">${['ä', 'ö', 'ü', 'ß'].map(char => `<button type="button" data-letter="${char}">${char}</button>`).join('')}</div>`}</div>
    ${feedback ? '' : '<div class="btns"><button class="primary" type="submit">Prüfen</button></div>'}</form>`;
  if (feedback) {
    bindPronunciation(word);
    return;
  }
  const input = $('#ans');
  view.querySelectorAll('[data-letter]').forEach(button => {
    button.onclick = () => {
      input.setRangeText(button.dataset.letter, input.selectionStart, input.selectionEnd, 'end');
      input.focus();
    };
  });
  $('#written').onsubmit = event => {
    event.preventDefault();
    const format = gap ? normalizeAnswer : withoutArticle;
    const entered = input.value.trim();
    if (!entered) { input.focus(); return; }
    const form = format(entered);
    const accepted = (gap ? [gap.solution, gap.sentence] : x.p.split(' / ')).map(format);
    const correct = accepted.some(value => form === value || form === keyboardSpelling(value));
    const umlautMissing = !correct && accepted.some(value => value.replace(/[äöü]/g, letter => ({ ä: 'a', ö: 'o', ü: 'u' }[letter])) === form);
    if (round) round.guess = entered;
    submit(word, type, correct, gap ? gap.sentence : pluralText(x), entered, umlautMissing ? 'Achte auf ä, ö oder ü.' : '');
  };
}

function renderList() {
  view.innerHTML = '<input id="q" type="search" aria-label="Wort suchen" placeholder="Wort suchen …" style="width:100%;margin-bottom:10px"><div class="wrap"><table id="t"></table></div>';
  const draw = () => {
    const query = normalize($('#q').value);
    const rows = manualPool().filter(word => normalize([word.x.a, plainWord(word.x.w), word.x.w, meaning(word), word.x.s].filter(Boolean).join(' ')).includes(query));
    $('#t').innerHTML = rows.map(word => {
      const x = word.x;
      const example = x.s ? `<div class="sub"><i>${html(x.s.split(' | ')[0])}</i></div>` : '';
      const term = [x.a, x.w].filter(Boolean).join(' ');
      const forms = x.t === 'n' ? html(pluralText(x)) : [x.er, x.pf].filter(Boolean).map(html).join('<br>');
      return `<tr><td aria-hidden="true">${html(meaningPicture(x))}</td><td class="${html(x.a?.split('/')[0])}"><b>${html(term)}</b></td><td>${forms}</td><td class="sub">${example}${translationDetails(word)}</td></tr>`;
    }).join('');
  };
  $('#q').oninput = draw;
  draw();
}

function render(motion = '') {
  const round = activeRound && S.rounds[activeRound];
  view.className = motion ? `motion-${motion}` : '';
  $('#study').hidden = !!round || !!results;
  $('#manual-menu').hidden = !!round || !!results;
  $('#save-note').hidden = storageAvailable;
  if (!round && !results) updateStudy();
  $('#cat-label').hidden = mode !== 'cards' && mode !== 'list';
  $('#tp-label').hidden = ch === 'all';
  document.querySelectorAll('[data-m]').forEach(button => {
    button.classList.toggle('on', button.dataset.m === mode);
    button.setAttribute('aria-pressed', String(button.dataset.m === mode));
  });
  if (results) {
    const title = results.empty ? roundNames[results.kind] : 'Runde fertig';
    const mistakes = reviewQueue('mistakes', dayKey()).length;
    const summary = results.empty
      ? results.kind === 'mistakes' ? 'Du hast keine offenen Fehler.' : 'Heute sind hier keine Wörter mehr fällig. Wähle ein anderes Thema oder komm morgen wieder.'
      : mistakes === 1 ? '1 offener Fehler' : `${mistakes} offene Fehler`;
    const total = results.empty ? '' : `<p class="finish-score">${results.correct}/${results.attempts}</p>${answerProgress(results.correct, results.attempts)}`;
    view.innerHTML = `<div class="card study-results"><h3>${title}</h3>${total}<p class="sub">${summary}</p><button class="primary" id="leave-round">Zur Übersicht</button></div>`;
    $('#leave-round').onclick = leaveRound;
    return;
  }
  if (!round && mode === 'list') return renderList();
  const item = round && round.queue[round.index];
  const word = item ? wordsById.get(item.id) : current;
  const type = item ? item.type : mode;
  const feedback = round ? round.answer : answer;
  if (!word) {
    view.innerHTML = '<p class="stat">Hier gibt es keine passenden Wörter. Wähle ein anderes Kapitel, Thema oder eine andere Wortart.</p>';
    return;
  }
  const context = round ? `${item.fresh ? 'Neues Wort' : labels[type]} · ${D[word.k].title}${word.x.tp ? ` · ${word.x.tp}` : ''}` : '';
  view.innerHTML = `${round ? headsUp(round) : answerProgress(score[0], score[1])}${context ? `<span class="chapter exercise-context">${html(context)}</span>` : ''}
    <div id="prompt" tabindex="-1"></div>${feedback ? '<div class="btns"><button class="primary" id="next-question">Weiter</button></div>' : ''}`;
  if (type === 'cards') renderCard(word, round, round ? round.shown : shown, feedback);
  else if (type === 'article') renderArticle(word, feedback);
  else renderWritten(word, type, round, feedback, round ? round.guess : guess);
  if (round) $('#leave-round').onclick = leaveRound;
  if (feedback) $('#next-question').onclick = advance;
}

async function ask(word, button) {
  const x = word.x;
  const example = x.s?.split(' | ')[0];
  button.disabled = true;
  button.textContent = '…';
  try {
    const result = await sampler.json(`German A1 learner (Arabic speaker). Entry: ${JSON.stringify([x.a, plainWord(x.w)].filter(Boolean).join(' '))}. ${example ? `Book example: ${JSON.stringify(example)}.` : 'No example given.'}
Reply with JSON only: {"en":"short English meaning","ar":"المعنى بالعربية (كلمة أو كلمتين)","de":"${example ? 'the book example unchanged' : 'one very short A1 German example sentence using the word, max 7 words'}","ard":"Arabic translation of the de sentence"}`);
    S.tr[word.id] = { en: result.en, ar: result.ar, de: result.de, ard: result.ard };
    save();
    if (button.isConnected) render();
  } catch {
    button.disabled = false;
    button.textContent = 'Nicht verfügbar';
  }
}

$('#ch').replaceChildren(new Option('Alle Kapitel', 'all'), ...Object.entries(D).map(([id, chapter]) => new Option(chapter.title, id)));
$('#ch').value = ch;
$('#cat').value = cat;
updateTopics(false);
$('#ch').onchange = event => { ch = event.target.value; updateTopics(true); selectManual(); };
$('#cat').onchange = event => { cat = event.target.value; selectManual(); };
$('#tp').onchange = event => { tp = event.target.value; selectManual(); };
document.querySelectorAll('[data-m]').forEach(button => { button.onclick = () => { mode = button.dataset.m; selectManual(); }; });
$('#study-today').onclick = () => openRound('today');
$('#study-mistakes').onclick = () => openRound('mistakes');
$('#sound-toggle').onclick = () => {
  soundEnabled = !soundEnabled;
  if (!soundEnabled && cueBus) cueBus.gain.value = 0;
  if (soundEnabled) playCue('reveal');
  updateSoundControl();
  save();
};
$('#voice-select').onchange = event => { preferredVoice = event.target.value; save(); };
$('#voice-speed').value = speechSlow ? 'slow' : 'normal';
$('#voice-speed').onchange = event => { speechSlow = event.target.value === 'slow'; save(); };
$('#voice-sample').onclick = () => speak('Guten Morgen! Ich hätte gern ein Brötchen und einen Kaffee.', pronunciationClips.sample);
$('#audio-stop').onclick = stopPlayback;
$('#pronunciation-settings').ontoggle = () => {
  if ($('#pronunciation-settings').open) { updateVoiceOptions(); preloadPronunciation(pronunciationClips.sample); }
};
speech?.addEventListener?.('voiceschanged', updateVoiceOptions);
updateVoiceOptions();
window.addEventListener('focus', () => { if (!activeRound && !results) updateStudy(); });

if (mode !== 'list') {
  const savedWord = wordsById.get(prefs.current);
  current = manualPool().find(word => word === savedWord) || pickManual();
  if (current && current === savedWord && isRecord(prefs.manual)) {
    shown = prefs.manual.shown === true;
    answer = isRecord(prefs.manual.answer) ? prefs.manual.answer : null;
    guess = typeof prefs.manual.guess === 'string' ? prefs.manual.guess : '';
    if (Array.isArray(prefs.manual.score) && prefs.manual.score.length === 2 && prefs.manual.score.every(Number.isInteger)) score = prefs.manual.score;
  }
}
if (owns(roundNames, prefs.round) && oldRound(prefs.round, dayKey())) activeRound = prefs.round;
save();
render();
updateSoundControl();
$('#startup-note').hidden = true;
$('#study-today').disabled = false;
$('#study-mistakes').disabled = false;

try {
  window.claude?.use('sample').then(result => {
    sampler = result;
    const active = activeRound && S.rounds[activeRound];
    if (!results && (active ? active.shown : mode === 'cards' && shown)) render();
  }).catch(() => {});
} catch {}
</script></body></html>
